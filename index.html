<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ВОВИК</title>
<meta name="vovik-version" content="0.45.1-dev">
<meta name="vovik-build" content="d6898279923d80060b55028641389af5045a82b30ce66cab04b75fb754bc5403">
<meta name="vovik-loader" content="2">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102022;color:#eee;font:16px sans-serif}
canvas{display:block;width:100%;height:100%;outline:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#102022}
#loading img{width:100%;max-height:90vh;object-fit:contain}
#status{position:absolute;bottom:3%;padding:8px 16px;background:#102022df;border-radius:5px;text-align:center;max-width:80%}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas" tabindex="0">Ваш браузер не поддерживает Canvas.</canvas>
<div id="loading"><img id="splash" alt="Вовик с коробками кассет"><div id="status" role="status">Загружаем лут…</div></div>
<script>
'use strict';

const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":39002296,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engineScriptUrl = 'index.js';
const splashUrl = 'index.png';
const canvas = document.getElementById('canvas');
const loading = document.getElementById('loading');
const status = document.getElementById('status');
const splash = document.getElementById('splash');

// Filled by package_web.py from the exact exported files. No extra manifest.
const assetHashes = {"index.apple-touch-icon.png":"sha256-LqWK+xn55zaB/CYpuKtXTsI8pIxuvB8SPjQKAMpx/Oc=","index.audio.position.worklet.js":"sha256-vjOYW8cWDWv5ZG8lnNhrJZzWewLMspfuXET4rIQye8g=","index.audio.worklet.js":"sha256-W0dqnJzmQsDuQlZDbRvDHZw4+GisoPmo4qV8GNLewqM=","index.icon.png":"sha256-4r7FEi2HAKSK5Tpk//LfUwU9JcJY9dwnC/LIMRt9ovk=","index.js":"sha256-21tuesqZzb4CTtcFVfc/8qI7gOPhfoUeA5py/XIRpzc=","index.pck":"sha256-RHlaS6nJZeIo2hhfwB7BAcMaa26ziiu65Hp2+nti/v0=","index.png":"sha256-f6zPUNYnqNzDYJdPFp2ASvMsNkuhf2vVHOdpx8AmJVE=","index.wasm":"sha256-/HRnnjuX92h4lH/NT74SaMv6YYgYKi4zu8P13Jv6V9A="};
const nativeFetch = window.fetch.bind(window);
const ownUrl = new URL(location.href);
const sessionToken = Date.now().toString() + '-' + Math.random().toString(36).slice(2);
function resourceUrl(path, token = sessionToken) {
  const url = new URL(path, ownUrl);
  url.searchParams.set('_vovik', token);
  return url.href;
}
window.fetch = (input, init = {}) => {
  const source = typeof input === 'string' ? input : (input instanceof URL ? input.href : input.url);
  const url = new URL(source, ownUrl);
  const name = url.pathname.split('/').pop();
  if (url.origin === ownUrl.origin && /\.(?:pck|wasm)$/i.test(name)) {
    const fresh = resourceUrl(url.href);
    const request = typeof input === 'string' || input instanceof URL ? fresh : new Request(fresh, input);
    const options = Object.assign({}, init, {cache: 'no-store'});
    if (assetHashes[name]) options.integrity = assetHashes[name];
    return nativeFetch(request, options);
  }
  return nativeFetch(input, init);
};

function freshNavigation(expected = '') {
  const url = new URL('index.html', ownUrl);
  url.search = ownUrl.search;
  url.hash = ownUrl.hash;
  url.searchParams.delete('_vovik_check');
  url.searchParams.set('_vovik_reload', sessionToken);
  if (expected) url.searchParams.set('_vovik_expected', expected);
  else url.searchParams.delete('_vovik_expected');
  location.replace(url.href);
}
// Registered before Godot: the canvas cannot consume the reload shortcut.
window.addEventListener('keydown', event => {
  if (event.key === 'F5' || ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'r')) {
    event.preventDefault();
    event.stopImmediatePropagation();
    freshNavigation();
  }
}, true);

async function unregisterLegacyGodotWorker() {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistrations) return false;
  try {
    const base = new URL('.', ownUrl).href;
    const registrations = await navigator.serviceWorker.getRegistrations();
    const results = await Promise.all(registrations.filter(reg => reg.scope.startsWith(base)).map(reg => reg.unregister()));
    const controller = navigator.serviceWorker.controller;
    // Unregistering does not detach an already controlled document: navigate once.
    return results.some(Boolean) && controller && controller.scriptURL && controller.scriptURL.startsWith(base);
  } catch (_) { return false; }
}

function pageMeta(html, name) {
  const tag = html.match(new RegExp('<meta\\s+name=["\']' + name + '["\']\\s+content=["\']([^"\']+)["\']', 'i'));
  return tag ? tag[1] : '';
}
function isOlder(incoming, current) {
  const a = incoming.match(/^(\d+)\.(\d+)\.(\d+)/);
  const b = current.match(/^(\d+)\.(\d+)\.(\d+)/);
  if (!a || !b) return true;
  for (let i = 1; i <= 3; i++) {
    if (+a[i] !== +b[i]) return +a[i] < +b[i];
  }
  return false;
}
async function currentRelease() {
  const version = document.querySelector('meta[name="vovik-version"]').content;
  const build = document.querySelector('meta[name="vovik-build"]').content;
  try {
    const url = new URL('index.html', ownUrl);
    url.searchParams.set('_vovik_check', sessionToken);
    const response = await nativeFetch(url.href, {cache: 'no-store', signal: AbortSignal.timeout(4000)});
    if (response.ok) {
      const html = await response.text();
      const incoming = pageMeta(html, 'vovik-build');
      const incomingVersion = pageMeta(html, 'vovik-version');
      if (/^[a-f0-9]{64}$/.test(incoming) && html.includes('const config = ') && !isOlder(incomingVersion, version) && incoming !== build) {
        if (ownUrl.searchParams.get('_vovik_expected') === incoming) {
          throw new Error('Обновление ещё публикуется. Откройте игру немного позже.');
        }
        freshNavigation(incoming);
        return null;
      }
    }
  } catch (error) {
    // Network/404/timeout must not strand a valid standalone export.
    // A repeated inconsistent deployment must never create a redirect loop.
    if (String(error.message).includes('Обновление ещё публикуется')) throw error;
  }
  window.__vovikFreshPage = true;
  return version + '-' + build + '-' + sessionToken;
}

function loadEngineScript(token) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = resourceUrl(engineScriptUrl, token);
    if (assetHashes[engineScriptUrl]) { script.integrity = assetHashes[engineScriptUrl]; script.crossOrigin = 'anonymous'; }
    script.onload = resolve;
    script.onerror = () => reject(new Error('Не удалось загрузить Web-движок Godot'));
    document.head.appendChild(script);
  });
}

async function boot() {
  const controlled = await unregisterLegacyGodotWorker();
  if (controlled && !ownUrl.searchParams.has('_vovik_sw')) {
    ownUrl.searchParams.set('_vovik_sw', '1'); freshNavigation(); return;
  }
  const token = await currentRelease();
  if (!token) return;
  splash.src = resourceUrl(splashUrl, token);
  await loadEngineScript(token);

  const engine = new Engine(config);
  await engine.startGame({
    canvas,
    canvasResizePolicy: 2,
    onProgress: (current, total) => {
      status.textContent = total > 0
        ? 'Загружаем лут… ' + Math.round(current / total * 100) + '%'
        : 'Загружаем лут…';
    }
  });

  loading.style.display = 'none';
  canvas.focus();
}

boot().catch(error => {
  status.textContent = 'Не удалось загрузить игру. ' + String(error.message || error);
});

canvas.addEventListener('pointerdown', () => canvas.focus());
</script>
</body>
</html>
