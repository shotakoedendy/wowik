<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ВОВИК</title>
<meta name="vovik-version" content="0.15.4-dev">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102022;color:#eee;font:16px sans-serif}
canvas{display:block;width:100%;height:100%;outline:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#102022}
#loading img{width:100%;max-height:90vh;object-fit:contain}
#status{position:absolute;bottom:3%;padding:8px 16px;background:#102022df;border-radius:5px;text-align:center;max-width:80%}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas" tabindex="0">Ваш браузер не поддерживает Canvas.</canvas>
<div id="loading"><img id="splash" alt="Вовик с коробками кассет"><div id="status" role="status">Загружаем лут…</div></div>
<script>
'use strict';

const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":24818312,"index.wasm":37900721},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engineScriptUrl = 'index.js';
const splashUrl = 'index.png';
const canvas = document.getElementById('canvas');
const loading = document.getElementById('loading');
const status = document.getElementById('status');
const splash = document.getElementById('splash');

// Permanent cache-busting layer for GitHub Pages and other static hosts.
// The PCK contains the actual game scripts/resources, so it must never come
// from a previous release's HTTP cache.
const nativeFetch = window.fetch.bind(window);
window.fetch = (input, init = {}) => {
  const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
  if (/\.(?:pck|wasm)(?:\?|$)/i.test(url)) {
    return nativeFetch(input, Object.assign({}, init, {cache: 'no-store'}));
  }
  return nativeFetch(input, init);
};

async function unregisterLegacyGodotWorker() {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistrations) return;
  try {
    const base = new URL('.', location.href).href;
    const registrations = await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations
      .filter(reg => reg.scope.startsWith(base))
      .map(reg => reg.unregister()));
  } catch (_) {
    // Never block startup only because an obsolete worker could not be removed.
  }
}

async function currentRelease() {
  // Direct Godot exports have no manifest. Version discovery is optional;
  // failure must never prevent an otherwise valid game from starting.
  const fallback = Date.now().toString();
  try {
    const url = new URL('current.json', location.href);
    url.searchParams.set('_', fallback);
    const response = await nativeFetch(url, {cache: 'no-store', signal: AbortSignal.timeout(2000)});
    if (!response.ok) return fallback;
    const release = await response.json();
    if (!/^wowik-[a-z0-9.-]+\.html$/.test(release.entry) || !/^[a-f0-9]{64}$/.test(release.build)) return fallback;
    // A leftover manifest must not downgrade a freshly exported standalone page.
    const own = document.querySelector('meta[name="vovik-version"]').content.match(/^(\d+)\.(\d+)\.(\d+)/);
    const incoming = String(release.version || '').match(/^(\d+)\.(\d+)\.(\d+)/);
    if (!incoming) return fallback;
    for (let i = 1; i <= 3; i++) {
      if (Number(incoming[i]) < Number(own[i])) return fallback;
      if (Number(incoming[i]) > Number(own[i])) break;
    }
    const target = new URL(release.entry, location.href);
    target.search = location.search;
    target.searchParams.set('v', release.build);
    target.hash = location.hash;
    if (target.pathname !== location.pathname || target.search !== location.search) {
      // During a partial upload the manifest may appear before its HTML.
      // Check the target instead of redirecting into a 404 or redirect loop.
      const page = await nativeFetch(target, {cache: 'no-store', signal: AbortSignal.timeout(2000)});
      if (!page.ok) return fallback;
      const html = await page.text();
      if (!html.includes('const config = ') || !html.includes('async function boot()')) return fallback;
      location.replace(target.href);
      return null;
    }
    return release.build;
  } catch (_) {
    return fallback;
  }
}

function loadEngineScript(token) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = engineScriptUrl + '?v=' + encodeURIComponent(token);
    script.onload = resolve;
    script.onerror = () => reject(new Error('Не удалось загрузить Web-движок Godot'));
    document.head.appendChild(script);
  });
}

async function boot() {
  await unregisterLegacyGodotWorker();
  const token = await currentRelease();
  if (!token) return;
  splash.src = splashUrl + '?v=' + encodeURIComponent(token);
  await loadEngineScript(token);

  const engine = new Engine(config);
  await engine.startGame({
    canvas,
    canvasResizePolicy: 2,
    onProgress: (current, total) => {
      status.textContent = total > 0
        ? 'Загружаем лут… ' + Math.round(current / total * 100) + '%'
        : 'Загружаем лут…';
    }
  });

  loading.style.display = 'none';
  canvas.focus();
}

boot().catch(error => {
  status.textContent = 'Не удалось загрузить игру. ' + String(error.message || error);
});

canvas.addEventListener('pointerdown', () => canvas.focus());
</script>
</body>
</html>
