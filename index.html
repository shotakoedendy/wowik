<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Вовик Сокобан</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102022;color:#eee;font:16px sans-serif}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#102022}#loading img{width:100%;max-height:90vh;object-fit:contain}#status{position:absolute;bottom:3%;padding:8px 16px;background:#102022df;border-radius:5px;text-align:center;max-width:80%}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head><body><canvas id="canvas" tabindex="0">Ваш браузер не поддерживает Canvas.</canvas><div id="loading"><img src="index.png" alt="Вовик с коробками кассет"><div id="status" role="status">Загружаем лут…</div></div>
<script src="index.js"></script><script>
'use strict';
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":16142768,"index.wasm":37900721},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const canvas = document.getElementById('canvas');
const loading = document.getElementById('loading');
const status = document.getElementById('status');
// Start immediately. Godot's menu starts its music on ready; browser autoplay policy still applies.
engine.startGame({canvas,canvasResizePolicy:2,onProgress:(current,total)=>{
 status.textContent=total>0?'Загружаем лут… '+Math.round(current/total*100)+'%':'Загружаем лут…';
}}).then(()=>{loading.style.display='none';canvas.focus();}).catch(error=>{
 status.textContent='Не удалось загрузить игру. '+String(error.message||error);
});
canvas.addEventListener('pointerdown',()=>canvas.focus());
</script></body></html>
